    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      (() => {
        if (!document.documentElement.hasAttribute("data-storefront-flagship")) return;
        let storedTheme = null;
        let hasStoredCookieConsent = false;
        try {
          storedTheme = localStorage.getItem("funkycommerce-mockup-theme");
          const storedConsent = JSON.parse(localStorage.getItem("funkycommerce-mockup-cookie-consent") || "null");
          hasStoredCookieConsent = Boolean(storedConsent && typeof storedConsent === "object");
        } catch {
          // Browser preference remains available when storage is restricted.
        }
        document.documentElement.setAttribute(
          "data-storefront-cookie-consent",
          hasStoredCookieConsent ? "stored" : "pending",
        );
        const isDark = storedTheme === "dark"
          || (storedTheme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        const applyTheme = (nextDark, persist) => {
          document.documentElement.classList.toggle("dark", nextDark);
          document.documentElement.style.colorScheme = nextDark ? "dark" : "light";
          if (persist) {
            try {
              localStorage.setItem("funkycommerce-mockup-theme", nextDark ? "dark" : "light");
            } catch {
              // The document-level theme still applies when storage is restricted.
            }
          }
          document.querySelectorAll("[data-static-theme-toggle]").forEach((control) => {
            control.setAttribute("aria-pressed", String(nextDark));
          });
        };
        applyTheme(isDark, false);
        document.addEventListener("click", (event) => {
          const control = event.target instanceof Element
            ? event.target.closest("[data-static-theme-toggle]")
            : null;
          if (!control) return;
          event.preventDefault();
          event.stopPropagation();
          const nextDark = !document.documentElement.classList.contains("dark");
          applyTheme(nextDark, true);
          window.dispatchEvent(new CustomEvent("funky:storefront-theme-change", {
            detail: { isDarkMode: nextDark },
          }));
        }, true);
      })();
    </script>
    <title>FunkyCommerce</title>
    <meta name="description" content="Shop, read, and connect with the FunkyCommerce community." />

    <!-- PWA manifest + icons. Real PNGs live in /public/icons/app (generated from the
         brand sparkle mark); the manifest also lists the scalable SVG source as an
         "any"-purpose fallback for browsers that support it. -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/icons/app/icon.svg" />

    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#09090b" />

    <!-- iOS-specific "add to home screen" install metadata — Safari on iOS doesn't
         read the manifest for these, it needs its own meta tags. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FunkyCommerce" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script type="speculationrules">
      {
        "prefetch": [{
          "source": "document",
          "where": {
            "and": [
              { "href_matches": "/*" },
              { "not": { "selector_matches": "[rel~='nofollow'], [target='_blank'], [download]" } }
            ]
          },
          "eagerness": "moderate"
        }],
        "prerender": [{
          "source": "document",
          "where": {
            "and": [
              { "href_matches": "/*" },
              { "not": { "href_matches": "/cart*" } },
              { "not": { "href_matches": "/checkout*" } },
              { "not": { "href_matches": "/account*" } },
              { "not": { "href_matches": "/auth*" } },
              { "not": { "selector_matches": "[rel~='nofollow'], [target='_blank'], [download]" } }
            ]
          },
          "eagerness": "conservative"
        }]
      }
    </script>
