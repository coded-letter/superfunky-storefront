<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FunkyCommerce Storefront Mockups</title>
    <meta name="description" content="A modern storefront experience — shop, journal, and account, installable as an app." />

    <!-- PWA manifest + icons. Real PNGs live in /public/icons/app (generated from the
         brand sparkle mark); the manifest also lists the scalable SVG source as an
         "any"-purpose fallback for browsers that support it. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/icons/app/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/app/apple-touch-icon.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#09090b" />

    <!-- iOS-specific "add to home screen" install metadata — Safari on iOS doesn't
         read the manifest for these, it needs its own meta tags. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FunkyCommerce" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
 </html>
